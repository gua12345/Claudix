# .github/workflows/build-and-release-vscode.yml

name: Build and Release Claudix Extension

on:
  push:
    branches:
      - Auto-package

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 👍 这一行是核心，它告诉Actions同时安装和缓存pnpm
          packageManager: 'pnpm@9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Extension
        run: |
          pnpm build
          pnpm package

      - name: Release Extension
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Claudix Development Build ${{ github.sha }}
          body: |
            Automated build of Claudix VSCode extension.
            - **Commit**: `${{ github.sha }}`
            - **Message**: `${{ github.event.head_commit.message }}`
          prerelease: true
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
