# .github/workflows/build-and-release-vscode.yml

name: Build and Release Claudix Extension

on:
  push:
    branches:
      - Auto-package

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 这个调试步骤暂时保留，等成功后可以删除
      - name: List working directory
        run: |
          echo "📁 Listing all files and folders in the root directory..."
          ls -la

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 👇 修改点1：完全移除了 'cache: pnpm' 这一行
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 👇 修改点2：移除了 --frozen-lockfile
      - name: Install dependencies
        run: pnpm install

      - name: Build and Package Extension
        run: |
          pnpm build
          pnpm package

      - name: Release Extension
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Claudix Development Build ${{ github.sha }}
          body: |
            Automated build of Claudix VSCode extension.
            - **Commit**: `${{ github.sha }}`
            - **Message**: `${{ github.event.head_commit.message }}`
          prerelease: true
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
