# .github/workflows/build-and-release-vscode.yml

name: Build and Release Claudix Extension

on:
  push:
    branches:
      - Auto-package

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 第一步：独立安装 pnpm，这是关键！
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # 使用明确的版本号

      # 👇 第二步：安装 Node.js，并利用上一步的 pnpm 来设置缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # 现在它能找到 pnpm 了，所以缓存设置不会报错

      # 👇 后续步骤保持不变
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Extension
        run: |
          pnpm build
          pnpm package

      - name: Release Extension
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Claudix Development Build ${{ github.sha }}
          body: |
            Automated build of Claudix VSCode extension.
            - **Commit**: `${{ github.sha }}`
            - **Message**: `${{ github.event.head_commit.message }}`
          prerelease: true
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
