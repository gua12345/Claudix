# .github/workflows/build-and-release-vscode.yml

name: Build and Release Claudix Extension

on:
  push:
    branches:
      - Auto-package

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 新增的调试步骤：查看工作目录文件
      - name: List working directory
        run: |
          echo "📁 Listing all files and folders in the root directory..."
          ls -la
          echo "---"
          echo "📁 Listing .github directory (if it exists)..."
          ls -la .github/ || echo ".github directory not found!"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Extension
        run: |
          pnpm build
          pnpm package

      - name: Release Extension
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Claudix Development Build ${{ github.sha }}
          body: |
            Automated build of Claudix VSCode extension.
            - **Commit**: `${{ github.sha }}`
            - **Message**: `${{ github.event.head_commit.message }}`
          prerelease: true
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
